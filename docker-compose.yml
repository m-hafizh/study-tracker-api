  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: study-tracker-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-study_tracker}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-very-long-secret}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
